<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELO Vietnam — Receiving demo screens</title>
<meta name="description" content="Every screen state of the VELO receiving prototype mockup. Illustrative data.">
<link rel="icon" type="image/png" href="../assets/Logo.png">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/motion.css">
<script src="/gradient-ascii.js" defer></script>
<script src="/motion.js" defer></script>
<link rel="stylesheet" href="velo-ui.css">
<style>
  body{padding:48px 56px 80px;min-width:1560px}
  .bd-head{display:flex;align-items:flex-end;gap:var(--space-24);padding-bottom:var(--space-24);margin-bottom:var(--space-40)}
  .bd-head h1{font-family:var(--display);font-size:var(--text-heading-lg);line-height:1.12;font-weight:600;color:var(--ink);letter-spacing:-.025em}
  .bd-head h1 b{color:var(--violet);font-style:normal;font-weight:600}
  .bd-head p{font-family:var(--sans);font-size:var(--text-body);line-height:1.6;font-weight:400;max-width:62ch;margin-left:auto;color:var(--slate)}
  .bd-head a{color:var(--violet);font-weight:500}
  .bd-head code{font-family:var(--mono);font-size:var(--text-caption);background:var(--glass-sheen),var(--glass-fill);border:var(--glass-border);box-shadow:var(--glass-rim);border-radius:var(--radius-pill);padding:var(--space-2) var(--space-8)}
  .bd-h2{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin:0 0 var(--space-20);color:var(--slate)}
  .row{display:flex;flex-wrap:wrap;gap:var(--space-40) var(--space-40);margin-bottom:var(--space-60)}
  figure{display:flex;flex-direction:column;gap:var(--space-12)}
  figcaption{display:flex;gap:var(--space-8);align-items:center;font-size:var(--text-small);font-weight:400;color:var(--slate)}
  figcaption a{color:var(--ink);background-image:var(--btn-glass-sheen-clear);background-color:var(--btn-glass-clear);-webkit-backdrop-filter:var(--btn-glass-blur);backdrop-filter:var(--btn-glass-blur);border:1px solid transparent;box-shadow:var(--btn-glass-shadow);border-radius:var(--radius-pill);padding:var(--space-4) var(--space-12);text-decoration:none;transition:box-shadow .2s ease,transform .15s ease,background-color .2s ease}
  figcaption a:hover{background-color:var(--btn-glass-clear-hover);box-shadow:var(--btn-glass-shadow-hover)}
  figcaption a:active{transform:scale(.98)}
  figcaption a:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
  .dashes{display:flex;flex-direction:column;gap:var(--space-48)}
  .solo{padding:40px;min-width:0;display:grid;place-items:center;min-height:100vh}
  .solo .bd-head,.solo .bd-h2,.solo figcaption{display:none}
  .solo .row,.solo .dashes{margin:0}
  @media(max-width:494px){
    .solo{padding:16px}
    .solo .phone{width:min(414px,calc(100vw - 32px))}
  }
</style>
</head>
<body>
<header class="bd-head">
  <h1>Velo <b>UI screens</b></h1>
  <p>Prototype mockup · every state used in the <a href="index.html">2-minute demo</a>. Click a caption to open that screen alone on a clean page. Add <code>&amp;bg=fog</code> or <code>&amp;bg=none</code> to change the background. All data is illustrative.</p>
</header>

<h2 class="bd-h2">Receiver phone app · Lan</h2>
<div class="row" id="phones"></div>

<h2 class="bd-h2">Manager dashboard · Minh</h2>
<div class="dashes" id="dashes"></div>

<script src="velo-ui.js"></script>
<script>
(function () {
  'use strict'
  // [id, screen, state, opts, label]
  const PHONES = [
    ['phone-deliveries', 'deliveries', 'today', {}, '01 · Expected deliveries today'],
    ['phone-note-aim', 'note', 'aim', {}, '02 · Scan the delivery note'],
    ['phone-note-reading', 'note', 'reading', {}, '02 · AI reading the note'],
    ['phone-extract', 'extract', 'review', {}, '02 · AI extraction · to confirm'],
    ['phone-extract-confirmed', 'extract', 'confirmed', {}, '02 · AI extraction · confirmed'],
    ['phone-count-aim', 'count', 'aim', {}, '03 · Scan · no-barcode fallback'],
    ['phone-count-sealant', 'count', 'counted', { line: 0 }, '03 · Count · SikaFlex 96 good, 4 damaged'],
    ['phone-count-cement', 'count', 'counted', { line: 1 }, '03 · Count · cement 20 good'],
    ['phone-match', 'match', 'live', {}, '04 · Live three-way match'],
    ['phone-flag-form', 'flag', 'form', {}, '05 · Flag · reason, photo required'],
    ['phone-flag-photo', 'flag', 'photo', {}, '05 · Flag · photo attached'],
    ['phone-flag-driver', 'flag', 'driver', {}, '05 · Flag · driver co-confirms'],
    ['phone-submitted', 'submitted', 'waiting', {}, '06 · Submitted · waiting for approval'],
    ['phone-approve', 'approve', 'queue', {}, '06 · Manager approval on phone'],
    ['phone-approved', 'approve', 'done', {}, '06 · Manager approved'],
    ['phone-receipt', 'receipt', 'issued', {}, '07 · Receipt issued'],
    ['phone-deliveries-done', 'deliveries', 'done', {}, '08 · Delivery received'],
  ]
  const DASHES = [
    ['expected', '01 · Expected delivery from a PO'],
    ['live', '04 · Live three-way match'],
    ['queue', '06 · Approval queue'],
    ['approved', '06 · Accept 96, claim 4'],
    ['receipt', '07 · Phiếu nhập kho + audit trail'],
    ['stock', '08 · Inventory, alerts, supplier accuracy'],
  ]

  const params = new URLSearchParams(location.search)
  const only = params.get('only')
  const bg = { fog: 'var(--fog)', none: 'transparent' }[params.get('bg')]
  if (bg) document.documentElement.style.background = document.body.style.background = bg

  const link = (id, label) => `<figcaption><a href="?only=${id}">${label}</a></figcaption>`

  document.getElementById('phones').innerHTML = PHONES
    .filter(([id]) => !only || id === only)
    .map(([id, sc, st, o, label]) => `<figure id="${id}"><div class="phone"><div class="ph-screen">${VeloUI.phone(sc, st, o)}</div></div>${link(id, label)}</figure>`)
    .join('')

  document.getElementById('dashes').innerHTML = DASHES
    .map(([st, label]) => ({ id: `dash-${st}`, st, label }))
    .filter((d) => !only || d.id === only)
    .map((d) => `<figure id="${d.id}"><div class="db">${VeloUI.dash(d.st)}</div>${link(d.id, d.label)}</figure>`)
    .join('')

  if (only) document.body.classList.add('solo')
})()
</script>
</body>
</html>
