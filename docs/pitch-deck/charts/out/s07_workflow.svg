   <g id="text_9">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #20201d" x="47.16" y="110.794219" transform="rotate(-0 47.16 110.794219)">Expected delivery</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(47.16 143.102856)">From PO or CSV import; no-PO mode</text>
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(47.16 154.670288)">when none exists</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #20201d" x="327.96" y="110.794219" transform="rotate(-0 327.96 110.794219)">Scan delivery note</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(327.96 143.102856)">AI OCR extracts supplier, lines,</text>
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(327.96 154.781851)">quantities; receiver confirms</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #20201d" x="608.76" y="110.628369" transform="rotate(-0 608.76 110.628369)">Scan &amp; count</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(608.76 143.102856)">Barcode / QR. No barcode → search,</text>
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(608.76 154.465005)">photo, print a QR label</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #20201d" x="889.56" y="110.794219" transform="rotate(-0 889.56 110.794219)">Live three-way match</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(889.56 143.102856)">Every line turns blue, yellow or</text>
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(889.56 154.726069)">red as counting proceeds</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #20201d" x="889.56" y="341.352422" transform="rotate(-0 889.56 341.352422)">Confirm or flag</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(889.56 373.614419)">Reason + photo for exceptions;</text>
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(889.56 385.293413)">driver co-confirms on the phone</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #20201d" x="608.76" y="341.028369" transform="rotate(-0 608.76 341.028369)">Manager approves</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(608.76 373.502856)">Accept, partial accept, reject, or</text>
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(608.76 385.126069)">open a supplier claim</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #20201d" x="327.96" y="341.194219" transform="rotate(-0 327.96 341.194219)">Digital goods receipt</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(327.96 374.014731)">Phiếu nhập kho generated with</text>
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(327.96 385.637944)">names, times and evidence</text>
   </g>
   <g id="text_23">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Segoe UI', 'DejaVu Sans'; text-anchor: start; fill: #20201d" x="47.16" y="341.194219" transform="rotate(-0 47.16 341.194219)">Live stock &amp; alerts</text>
   </g>
   <g id="text_24">
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(47.16 373.502856)">Batch, expiry (FEFO), low stock,</text>
    <text style="font-size: 10.5px; font-family: 'Segoe UI', 'DejaVu Sans'; fill: #555247" transform="translate(47.16 385.126069)">supplier accuracy</text>
   </g>
